name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: 'func-rapidgo-backend'
  PYTHON_VERSION: '3.11'
  WORKING_DIRECTORY: 'src/backend'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: tdea-2026-01-cloud-computing
    env:
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
      TF_VAR_fcm_api_key: ${{ secrets.TF_VAR_fcm_api_key }}
      TF_VAR_apns_certificate: ${{ secrets.TF_VAR_apns_certificate }}
    defaults:
      run:
        working-directory: ./src/iac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check || echo "Format check failed"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

  deploy-backend:
    name: 'Deploy Backend'
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: tdea-2026-01-cloud-computing
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 'Install dependencies and run tests'
        shell: bash
        run: |
          pushd './${{ env.WORKING_DIRECTORY }}'
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ejecutar pruebas unitarias antes de desplegar
          python -m unittest discover tests
          popd

      - name: 'Zip and Deploy to Azure Functions'
        shell: bash
        run: |
          # Crear un paquete zip limpio con la aplicación
          cd '${{ env.WORKING_DIRECTORY }}'
          zip -r ../../deploy.zip . -x "*.pytest_cache*" -x "*__pycache__*" -x "*.venv*" -x "*.python_packages*" -x "tests*"
          cd ../..
          
          # Desplegar usando az cli con build remoto para compilar dependencias en el host de Azure
          # Se añade un pequeño reintento para mitigar posibles bloqueos residuales de Terraform
          for i in {1..3}; do
            az functionapp deployment source config-zip \
              -g 'serverless_backend_application_mobile' \
              -n '${{ env.AZURE_FUNCTIONAPP_NAME }}' \
              --src 'deploy.zip' \
              --build-remote true && break || \
              (echo "Despliegue fallido, reintentando en 30s..." && sleep 30);
          done

